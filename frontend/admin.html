<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Srinivasa Textiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body style="background: var(--bg-surface-alt); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 1.5rem; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif;">
  <div style="max-width: 480px; width: 100%; background: var(--bg-surface); border: 1.5px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem 2rem; box-shadow: 0 12px 36px rgba(0,0,0,0.08);">
    <div style="margin-bottom: 1rem; color: var(--color-gold);"><span data-icon="search" data-icon-size="48"></span></div>
    <span style="display: inline-block; background: rgba(239, 68, 68, 0.12); color: #DC2626; border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.25rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem;">
      Error 404
    </span>
    <h1 style="font-family: 'Cinzel', serif; color: var(--color-primary); font-size: 1.75rem; margin: 0 0 0.75rem 0;">
      Page Not Found
    </h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin: 0 0 1.75rem 0;">
      The page you are looking for does not exist or has been moved.
    </p>
    <a href="index.html" class="btn btn-gold btn-lg" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-weight: 800; text-decoration: none; padding: 0.75rem 1.75rem; box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);">
      <span>←</span> Back to Home
    </a>
  </div>
  <script src="js/icons.js"></script>
</body>
</html>
